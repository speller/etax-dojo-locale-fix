name: Build and release Chrome extension
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package
        run: python scripts/build.py
      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/*.zip
      - name: Publish GitHub Release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "Tag and manifest version differ"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --verify-tag
